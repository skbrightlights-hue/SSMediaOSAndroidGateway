
name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          validate-wrappers: false

      - name: Arrange Android project files
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/ssmediaos/smsgateway
          mkdir -p app/src/main/res/values

          for file in MainActivity.kt GatewayService.kt SecureConfig.kt ApiClient.kt SmsSentReceiver.kt; do
            if [ -f "$file" ]; then
              mv "$file" app/src/main/java/com/ssmediaos/smsgateway/
            fi
          done

          if [ -f AndroidManifest.xml ]; then
            mv AndroidManifest.xml app/src/main/
          fi

          if [ -f styles.xml ]; then
            mv styles.xml app/src/main/res/values/
          fi

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.ssmediaos.smsgateway"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.ssmediaos.smsgateway"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          echo "Project files arranged."
          find app/src/main -maxdepth 5 -type f

      - name: Build signed debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SSMediaOS-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

