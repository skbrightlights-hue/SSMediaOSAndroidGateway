```yaml
name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          validate-wrappers: false

      - name: Locate and install logo resource
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/res/drawable

          if [ -f app/src/main/res/drawable/ic_ssmediaos_logo.xml ]; then
            echo "Logo already exists in drawable."
          elif [ -f ic_ssmediaos_logo.xml ]; then
            cp ic_ssmediaos_logo.xml app/src/main/res/drawable/ic_ssmediaos_logo.xml
          else
            echo "Searching repository for logo..."
            LOGO="$(find . -type f -name 'ic_ssmediaos_logo.xml' \
              -not -path './.git/*' -print -quit)"

            if [ -z "$LOGO" ]; then
              echo "ERROR: ic_ssmediaos_logo.xml was not found."
              exit 1
            fi

            cp "$LOGO" app/src/main/res/drawable/ic_ssmediaos_logo.xml
          fi

          echo "Logo resource is ready:"
          ls -l app/src/main/res/drawable/ic_ssmediaos_logo.xml

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SSMediaOS-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
```
